# MQTT broker for the plugin's MQTT transport (Boomi and Django subscribe here)
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
max_queued_messages 1000000
max_queued_bytes 0
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
