// BIMBA IT/OT Agent - Ignition 8.1 gateway module
// Build (no local JDK needed):  ..\scripts\build-module.ps1   ->  build/modl/BIMBA-IT-OT-Agent-<version>.modl
plugins {
    id 'java'
}

group = 'com.bimba'
version = '1.4.1'

def sdkVersion = '8.1.55'
def minIgnitionVersion = '8.1.33'

repositories {
    maven { url 'https://nexus.inductiveautomation.com/repository/public/' }
    mavenCentral()
}

java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }

configurations {
    bundled                                  // jars shipped inside the .modl
    implementation.extendsFrom bundled
    compileClasspath { exclude group: 'org.python' }   // Jython (37 MB) is not used by this module
}

dependencies {
    compileOnly "com.inductiveautomation.ignitionsdk:ignition-common:${sdkVersion}"
    compileOnly "com.inductiveautomation.ignitionsdk:gateway-api:${sdkVersion}"

    bundled 'com.google.code.gson:gson:2.11.0'
    bundled 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // Kafka producer (its config classes reference the zstd/snappy codecs, so they must be bundled)
    bundled('org.apache.kafka:kafka-clients:3.8.0') {
        exclude group: 'org.slf4j'                         // provided by the Ignition gateway
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17                     // Ignition 8.1.33+ runs on Java 17
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'bimba-connector-gateway'
}

def moduleXml = tasks.register('moduleXml') {
    def out = layout.buildDirectory.file('modl-staging/module.xml')
    outputs.file(out)
    inputs.property('version', project.version)
    doLast {
        def jars = ([jar.archiveFileName.get()] + configurations.bundled.files.collect { it.name })
                .collect { "    <jar scope=\"G\">${it}</jar>" }.join('\n')
        out.get().asFile.parentFile.mkdirs()
        out.get().asFile.text = """<?xml version="1.0" encoding="UTF-8"?>
<modules>
  <module>
    <id>com.bimba.connector</id>
    <name>BIMBA IT/OT Agent</name>
    <description>Streams Ignition tag data as canonical JSON to Boomi Event Streams (primary) and BIMBA Ingest (failover) over REST or MQTT, plus mirror routes (Kafka, webhooks), with disk store-and-forward.</description>
    <version>${project.version}</version>
    <requiredignitionversion>${minIgnitionVersion}</requiredignitionversion>
    <requiredframeworkversion>8</requiredframeworkversion>
    <freeModule>true</freeModule>
${jars}
    <hook scope="G">com.bimba.ignition.GatewayHook</hook>
  </module>
</modules>
"""
    }
}

tasks.register('modl', Zip) {
    group = 'build'
    description = 'Packages the Ignition module (.modl)'
    dependsOn jar, moduleXml
    archiveFileName = "BIMBA-IT-OT-Agent-${project.version}.modl"
    destinationDirectory = layout.buildDirectory.dir('modl')
    from(layout.buildDirectory.file('modl-staging/module.xml'))
    from('src/main/modl') // license.html (informational)
    from(jar)
    from(configurations.bundled)
}

// helper for API inspection: prints the resolved SDK jars
tasks.register('printSdkJars') {
    doLast { configurations.compileClasspath.files.each { println it } }
}
