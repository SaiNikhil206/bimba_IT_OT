# BIMBA cloud broker - stand-in for the cloud ingestion endpoint
# (in production: Boomi Event Streams / managed MQTT / Boomi Cloud Runtime)

per_listener_settings true

persistence true
persistence_location /mosquitto/data/
autosave_interval 5
max_queued_messages 2000000
max_queued_bytes 0

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# ---------------------------------------------------------------- plant-facing
# Mutual TLS: each plant edge presents a client cert signed by the BIMBA CA.
listener 8883 0.0.0.0
cafile /certs/ca.crt
certfile /certs/cloud-mqtt.crt
keyfile /certs/cloud-mqtt.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false

# ---------------------------------------------------------------- cloud-internal
# For cloud consumers: Boomi runtime, ingest service, MQTT Explorer.
listener 1883 0.0.0.0
allow_anonymous true
