// Subset of the Eclipse Tahu Sparkplug B payload definition (sparkplug_b.proto).
// Field numbers match the specification so payloads are wire-compatible with
// any Sparkplug B 3.0 client. Metadata, PropertySet, DataSet and Template are
// omitted; protobuf skips those fields when parsing.
syntax = "proto2";

package org.eclipse.tahu.protobuf;

message Payload {
    message Metric {
        optional string name          = 1;
        optional uint64 alias         = 2;
        optional uint64 timestamp     = 3;   // ms since epoch
        optional uint32 datatype      = 4;
        optional bool   is_historical = 5;
        optional bool   is_transient  = 6;
        optional bool   is_null       = 7;

        oneof value {
            uint32 int_value     = 10;
            uint64 long_value    = 11;
            float  float_value   = 12;
            double double_value  = 13;
            bool   boolean_value = 14;
            string string_value  = 15;
            bytes  bytes_value   = 16;
        }
    }

    optional uint64 timestamp = 1;
    repeated Metric metrics   = 2;
    optional uint64 seq       = 3;
    optional string uuid      = 4;
    optional bytes  body      = 5;
}

// Sparkplug B data types (subset)
//   1 Int8   2 Int16   3 Int32   4 Int64   5 UInt8   6 UInt16   7 UInt32
//   8 UInt64 9 Float  10 Double 11 Boolean 12 String 13 DateTime 14 Text
