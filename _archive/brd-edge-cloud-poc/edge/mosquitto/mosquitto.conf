# BIMBA edge broker - plant floor / Purdue L3 (Model B local ingestion point)
#
# * Local listener for OT devices and the BIMBA edge agent (plant network only)
# * Persistent, disk-backed queue: if the WAN is down the bridge's messages
#   accumulate here and flush automatically on reconnect (NFR-2)
# * Bridge to the cloud broker is OUTBOUND ONLY, mutual TLS 1.2+ (NFR-1)

per_listener_settings false
allow_anonymous true
listener 1883 0.0.0.0

persistence true
persistence_location /mosquitto/data/
autosave_interval 5
max_queued_messages 2000000
max_queued_bytes 0
max_inflight_messages 100

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# ---------------------------------------------------------------- cloud bridge
connection plant01-cloud-bridge
address cloud-mqtt:8883
remote_clientid plant01-edge-bridge
bridge_protocol_version mqttv311
bridge_cafile /certs/ca.crt
bridge_certfile /certs/edge-bridge.crt
bridge_keyfile /certs/edge-bridge.key
bridge_tls_version tlsv1.2
bridge_insecure false

# persistent sessions on both sides = store-and-forward
cleansession false
local_cleansession false
try_private true
keepalive_interval 15
restart_timeout 2 30

# connection state (1/0) visible to the cloud side, incl. last-will on WAN loss
notifications true
notification_topic bimba/v1/_bridge/PLANT01/state

# Only canonical, normalized data leaves the plant; raw device topics stay local.
topic bimba/v1/# out 1
