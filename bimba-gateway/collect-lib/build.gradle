// Field drivers (Modbus TCP, OPC UA) + the polling collector, shared by the BIMBA Gateway and the edge collector the
// BIMBA Site Agent runs on SCADA machines. Plain Java 17 (the edge ships a Java 17 runtime), no Spring.
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
    api 'com.google.code.gson:gson:2.11.0'
    api 'org.slf4j:slf4j-api:2.0.16'
    api 'com.ghgande:j2mod:3.2.1'                                   // Modbus TCP
    api 'org.eclipse.milo:sdk-client:0.6.14'                        // OPC UA client
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
