# BIMBA Setu (Spring Boot). Every value can be set through the environment variables shown.
server:
  port: ${BIMBA_HTTP_PORT:8090}              # HTTPS: bimba.https-port, extra connector (web/HttpsConnector)
  error:
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: bimba-setu
  main:
    banner-mode: off
  datasource:
    # shared PostgreSQL: site agent registry, console users/roles, destinations and the built-in BIMBA database
    # destination (bimba_ingest). prepareThreshold=0 because the pooler in front
    # of the shared database runs in transaction mode (no named server-side statements).
    url: jdbc:postgresql://${BIMBA_DB_HOST:localhost}:${BIMBA_DB_PORT:5432}/${BIMBA_DB_NAME:bimba}?prepareThreshold=0&ApplicationName=bimba-setu&connectTimeout=10&socketTimeout=30
    username: ${BIMBA_DB_USER:bimba}
    password: ${BIMBA_DB_PASSWORD:}
    hikari:
      pool-name: bimba-db
      maximum-pool-size: 6
      minimum-idle: 1
      connection-timeout: 5000
      initialization-fail-timeout: -1        # start and keep collecting data even while the database is down
  mail:                                      # SMTP for password reset e-mails; empty host = the link goes to Setu log
    host: ${BIMBA_SMTP_HOST:}
    port: ${BIMBA_SMTP_PORT:587}
    username: ${BIMBA_SMTP_USER:}
    password: ${BIMBA_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${BIMBA_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${BIMBA_SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${BIMBA_SMTP_SSL:false}      # true for port 465
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true                     # index.html revalidates; Vite assets are content-hashed anyway

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

bimba:
  config-dir: ${BIMBA_CONFIG_DIR:config}     # config.json, tag tree, device connections (hot-reloaded)
  data-dir: ${BIMBA_DATA_DIR:data}           # disk buffer + HTTPS key store
  https-port: ${BIMBA_HTTPS_PORT:8443}       # 0 = no HTTPS connector
  public-url: ${BIMBA_PUBLIC_URL:http://localhost:8090}   # the console address used in e-mailed links (never taken from the request)
  mail-from: ${BIMBA_MAIL_FROM:}             # sender of console e-mails (default: the SMTP user)
  db:
    schema: ${BIMBA_DB_SCHEMA:bimba}

logging:
  level:
    org.eclipse.milo: warn
    org.apache.kafka: warn
    com.ghgande: warn
    io.netty: warn
    com.zaxxer.hikari: warn
