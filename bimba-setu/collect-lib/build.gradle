// Field drivers (Modbus TCP, OPC UA, OPC DA, MQTT, S7, Logix, DNP3, IEC 104, SQL) + the polling collector, shared by the BIMBA Setu and the edge collector the
// BIMBA Site Agent runs on SCADA machines. Plain Java 17 (the edge ships a Java 17 runtime), no Spring.
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
    api 'com.google.code.gson:gson:2.11.0'
    api 'org.slf4j:slf4j-api:2.0.16'
    api 'com.ghgande:j2mod:3.2.1'                                   // Modbus TCP
    api 'org.eclipse.milo:sdk-client:0.6.14'                        // OPC UA client
    api 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'     // MQTT / Sparkplug B sources
    // SQL / historian sources (Setu's JDBC destination uses the same drivers, versions from Spring Boot there)
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation('org.mariadb.jdbc:mariadb-java-client:3.5.1') {  // MariaDB and MySQL (LGPL, unlike Connector/J)
        exclude group: 'com.github.waffle'                           // Windows single sign-on (JNA, 4 MB): not offered
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.moquette:moquette-broker:0.17'           // in-memory MQTT broker for the driver tests
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
