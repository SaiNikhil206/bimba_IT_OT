# Render Blueprint: BIMBA Setu (Spring Boot, Java 21) built from bimba-setu/Dockerfile.
# Render terminates HTTPS on 443 and forwards to the console port 8090.
services:
  - type: web
    name: bimba-setu
    runtime: docker
    dockerfilePath: ./bimba-setu/Dockerfile
    dockerContext: ./bimba-setu
    branch: release/dev
    plan: free               # sleeps after 15 min idle; no disk, so /data resets on restart
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8090"
      # free plan = 512 MB: serial GC, small thread stacks and capped metaspace/code cache leave more of it to the heap;
      # on an out-of-memory the JVM exits at once so Render restarts it instead of leaving it hung
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=80m -XX:ReservedCodeCacheSize=40m -XX:MaxDirectMemorySize=32m -XX:+ExitOnOutOfMemoryError"
      - key: BIMBA_DB_HOST
        sync: false
      - key: BIMBA_DB_PORT
        value: "6433"
      - key: BIMBA_DB_NAME
        value: bimba_chromalab
      - key: BIMBA_DB_USER
        sync: false
      - key: BIMBA_DB_PASSWORD
        sync: false
      - key: BIMBA_DB_SCHEMA
        value: bimba_ignition
      - key: BIMBA_SECRET_KEY
        generateValue: true
      - key: BIMBA_PUBLIC_URL
        sync: false
      - key: BOOMI_ES_PRODUCE_TOKEN
        sync: false
